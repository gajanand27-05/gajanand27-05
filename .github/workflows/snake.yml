name: Generate Contribution Snake

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: gajanand27-05
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#FF2E97&color_dots=#0A0A0F,#3D1A6B,#7B2CFF,#00B8D4,#00F0FF
            dist/snake-dark.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#0A0A0F,#4A0F30,#7B2CFF,#C41E7A,#FF2E97

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
