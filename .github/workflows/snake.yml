name: Generate Contribution Snake

on:
  schedule:
    # Every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: gajanand27-05
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0B1220,#1E3A5F,#0E7490,#2DD4BF,#38BDF8
            dist/snake-dark.svg?palette=github-dark&color_snake=#2DD4BF&color_dots=#0B1220,#164E63,#4F79C4,#38BDF8,#2DD4BF

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
